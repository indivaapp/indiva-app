name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Telefondan manuel tetikleyebilirsin
    inputs:
      build_type:
        description: 'Çıktı türü'
        type: choice
        options: [release, debug, aab]
        default: release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Gerçek release keystore'u secrets'tan geri kur — KEYSTORE_BASE64 secret'ı
      # yoksa bu adım atlanır ve build.gradle otomatik olarak debug anahtarına
      # düşer (bkz. android/app/build.gradle: hasReleaseKeystore).
      - name: Decode release keystore
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/indiva-release.keystore
            cat > android/local.properties <<EOF
          KEYSTORE_PATH=indiva-release.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "✅ Release keystore kuruldu — gerçek imzayla build alınacak."
          else
            echo "⚠️ KEYSTORE_BASE64 secret'ı yok — release build debug anahtarıyla imzalanacak (test amaçlı, Play Store'u güncelleyemez)."
          fi

      - name: Build APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        run: cd android && ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }} --no-daemon

      - name: Build AAB (Play Store)
        if: ${{ github.event.inputs.build_type == 'aab' }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: indiva-${{ github.event.inputs.build_type || 'release' }}-apk
          path: android/app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/app-${{ github.event.inputs.build_type || 'release' }}.apk
          retention-days: 30

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: indiva-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
