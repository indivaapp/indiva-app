name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Telefondan manuel tetikleyebilirsin
    inputs:
      build_type:
        description: 'APK türü'
        type: choice
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # push tetiklemesinde (workflow_dispatch girdisi yok) release imzalı build denenir —
      # local.properties'deki release keystore bilgisi olmadan CI'da bu adım başarısız olur;
      # elle tetiklerken build_type=debug seçilerek repodaki debug.keystore ile imzalı bir
      # test APK'sı üretilebilir.
      - name: Build APK
        run: cd android && ./gradlew assemble${{ (github.event.inputs.build_type || 'release') == 'debug' && 'Debug' || 'Release' }} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indiva-${{ github.event.inputs.build_type || 'release' }}-apk
          path: android/app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/app-${{ github.event.inputs.build_type || 'release' }}.apk
          retention-days: 30
